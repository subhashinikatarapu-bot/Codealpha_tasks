<!DOCTYPE html>
<html>
<head>
    <title>My E-Commerce Store</title>
</head>

<body>

    <h1>My E-Commerce Store</h1>

    <div class="product">
        <h2>T-Shirt</h2>
        <p>Price: ₹499</p>
        <button onclick="addToCart('T-Shirt')">Add to Cart</button>
    </div>

    <div class="product">
        <h2>Shoes</h2>
        <p>Price: ₹999</p>
        <button onclick="addToCart('Shoes')">Add to Cart</button>
    </div>

    <div class="product">
        <h2>Watch</h2>
        <p>Price: ₹799</p>
        <button onclick="addToCart('Watch')">Add to Cart</button>
    </div>

    <div class="product">
        <h2>Headphones</h2>
        <p>Price: ₹699</p>
        <button onclick="addToCart('Headphones')">Add to Cart</button>
    </div>

    <script>
        function addToCart(product) {
            alert(product + " added to cart!");
        }
    </script>

</body>
</html>
